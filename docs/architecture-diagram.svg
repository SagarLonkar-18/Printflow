<svg width="1500" height="780" viewBox="0 0 1500 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PrintFlow system architecture</title>
  <desc>Customer scans a shop QR code, opens the PrintFlow web app, and uploads a PDF directly to S3 via a presigned URL while the app talks to the Cloud API to create the order. The API writes to PostgreSQL, uses Redis for rate limiting and pub/sub, and pushes a live Socket.IO event to the shop owner's dashboard, which also talks to the API over REST with a JWT.</desc>

  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#aab0c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#7d8399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="780" fill="#1a1f1c"/>

  <!-- ===================== ARROWS ===================== -->

  <!-- Customer -> Web App -->
  <path d="M 141 330 C 165 327, 185 331, 207 329" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="143" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd9">scans QR at counter</text>

  <!-- Web App -> Cloud API (request presign) -->
  <path d="M 461 305 C 540 292, 610 288, 676 296" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="480" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd9">REST, request upload URL</text>

  <!-- Web App -> Cloud API (create order) -->
  <path d="M 461 352 C 540 355, 610 350, 676 335" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="490" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd9">REST, create order</text>

  <!-- Cloud API -> Web App dashed (confirmation) -->
  <path d="M 700 384 C 630 440, 510 448, 420 384" fill="none" stroke="#7d8399" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" filter="url(#roughSoft)" marker-end="url(#arrowDim)"/>
  <text x="500" y="470" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9298ac">order id + status</text>

  <!-- Web App -> S3 direct upload, dashed, big arc over the top -->
  <path d="M 320 278 C 300 150, 500 60, 780 55 C 950 52, 1050 65, 1090 92" fill="none" stroke="#7d8399" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" filter="url(#roughSoft)" marker-end="url(#arrowDim)"/>
  <text x="560" y="46" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9298ac">PUT file, direct to bucket (bypasses API)</text>

  <!-- Cloud API -> Postgres -->
  <path d="M 750 384 C 738 435, 728 478, 722 518" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="600" y="418" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd9">Prisma queries</text>

  <!-- Cloud API -> Redis -->
  <path d="M 838 384 C 862 435, 885 478, 902 518" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="782" y="418" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd9">rate limit, pub/sub</text>

  <!-- Cloud API -> S3 (presign signing) -->
  <path d="M 850 278 C 920 230, 990 200, 1048 178" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="880" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd9">sign PutObject / GetObject</text>

  <!-- Cloud API -> Owner Dashboard (socket event, dashed) -->
  <path d="M 850 384 C 930 435, 1000 460, 1048 480" fill="none" stroke="#7d8399" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" filter="url(#roughSoft)" marker-end="url(#arrowDim)"/>
  <text x="905" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9298ac">Socket.IO, order:new</text>

  <!-- Owner Dashboard -> Cloud API (REST + JWT), enters API right edge -->
  <path d="M 1078 470 C 1010 415, 940 370, 892 350" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)" marker-end="url(#arrow)"/>
  <text x="988" y="398" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd9">REST + JWT</text>

  <!-- ===================== NODES ===================== -->

  <!-- Customer actor -->
  <g filter="url(#rough)">
    <circle cx="95" cy="330" r="46" fill="#252b2a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="95" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef0f5">Customer</text>
  <text x="95" y="343" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#9298ac">at the counter</text>

  <!-- PrintFlow Web App -->
  <g filter="url(#rough)">
    <rect x="210" y="280" width="250" height="100" rx="7" fill="#252b3a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="335" y="317" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#eef0f5">PrintFlow Web App</text>
  <text x="335" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">React + Vite, on CloudFront</text>
  <text x="335" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">upload form + print settings</text>

  <!-- Cloud API -->
  <g filter="url(#rough)">
    <rect x="680" y="280" width="210" height="104" rx="7" fill="#252b3a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="785" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#eef0f5">Cloud API</text>
  <text x="785" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">Express + TS, on Lightsail</text>
  <text x="785" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">behind Nginx (TLS)</text>

  <!-- PostgreSQL -->
  <g filter="url(#rough)">
    <rect x="638" y="518" width="168" height="78" rx="7" fill="#252b3a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="722" y="550" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#eef0f5">PostgreSQL</text>
  <text x="722" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a7acc0">orders, files, shops</text>

  <!-- Redis -->
  <g filter="url(#rough)">
    <rect x="820" y="518" width="168" height="78" rx="7" fill="#252b3a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="904" y="550" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#eef0f5">Redis</text>
  <text x="904" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a7acc0">rate limiter + Socket.IO adapter</text>

  <!-- S3 uploads -->
  <g filter="url(#rough)">
    <rect x="1050" y="90" width="230" height="100" rx="7" fill="#252b3a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="1165" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#eef0f5">S3 - uploads bucket</text>
  <text x="1165" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">private, presigned access only</text>
  <text x="1165" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">IAM: PutObject + GetObject, one bucket</text>

  <!-- Owner Dashboard -->
  <g filter="url(#rough)">
    <rect x="1050" y="470" width="250" height="100" rx="7" fill="#252b3a" stroke="#9098b0" stroke-width="1.8"/>
  </g>
  <text x="1175" y="508" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#eef0f5">Shop Owner Dashboard</text>
  <text x="1175" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">live order queue, per-file status</text>
  <text x="1175" y="548" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a7acc0">print / mark completed</text>

  <!-- ===================== caption / legend ===================== -->
  <path d="M 95 700 C 115 698, 130 701, 150 699" fill="none" stroke="#aab0c4" stroke-width="1.6" filter="url(#roughSoft)"/>
  <text x="160" y="705" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9298ac">request / query</text>
  <path d="M 340 700 C 360 698, 375 701, 395 699" fill="none" stroke="#7d8399" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" filter="url(#roughSoft)"/>
  <text x="405" y="705" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9298ac">direct transfer / async event</text>

  <text x="95" y="750" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7d8399">The API issues the presigned URL but never receives the file bytes - upload bandwidth stays off the API server.</text>
</svg>
