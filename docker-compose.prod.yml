services:
  postgres:
    image: postgres:16-alpine
    container_name: printflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - printflow_pg_data:/var/lib/postgresql/data
    networks:
      - printflow_net

  redis:
    image: redis:7-alpine
    container_name: printflow-redis
    restart: unless-stopped
    volumes:
      - printflow_redis_data:/data
    networks:
      - printflow_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printflow-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    networks:
      - printflow_net

networks:
  printflow_net:
    driver: bridge

volumes:
  printflow_pg_data:
  printflow_redis_data: